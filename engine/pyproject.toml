[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engine"
version = "0.1.0"
description = "FinPanel Virtual Capital — AI Agent hedge fund engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "openai>=1.55.0",
    "apscheduler>=3.10.4",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "PyYAML>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.scripts]
finpanel-daily = "agent_engine.scripts.daily_run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_engine*"]
