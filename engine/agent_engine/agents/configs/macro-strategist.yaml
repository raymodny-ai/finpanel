  works_with: [metals-da, metals-qm, risk-cro]
  can_challenge: [metals-qm]
  must_escalate_to: [cio]
  cannot_override: [risk-cro]

data_sources:
  - treasury-gov
  - gold-api
tools: [macro-dashboard]
reasoning_mode: structured
playbook_ids: []

memory_access:
  short_term: true
  department_memory: true
  firm_memory: true
  cross_dept_meeting_records: true

governance:
  approval_required: false
  audit_level: medium
  confidence_threshold: 0.3
  max_output_length: 1800

prompt_file: macro-strategist.md
trigger_modes: [scheduled, event_driven, manual]
